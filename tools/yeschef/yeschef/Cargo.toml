[package]
name = "yeschef"
version = "0.1.0"
description = "Build-time asset converter. Replaces assetconv."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.0"

[dev-dependencies]
tempfile = "3.27.0"
