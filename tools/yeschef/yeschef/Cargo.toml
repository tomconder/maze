[package]
name = "yeschef"
version = "0.1.0"
description = "Build-time asset converter."
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
ctt-bc7f = "0.6.1"
glam = "0.34.3"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "extensions"] }
harfrust = "0.16.0"
indexmap = { version = "2.14.2", features = ["serde"] }
indicatif = "0.18.6"
meshopt = "0.7.0"
png = "0.18.1"
rayon = "1.12.0"
rectangle-pack = "0.4.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
shader-slang = "0.1.0"
skrifa = "0.50.0"
yeschef-format = { version = "0.1.0", path = "../format" }
zeno = "0.3.3"
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[dev-dependencies]
bytemuck = "1.25.2"
tempfile = "3.27.0"
